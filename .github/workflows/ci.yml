name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -o atlas-doris ./cmd/atlas-doris

      - name: Vet
        run: go vet ./...

      - name: Test & Coverage Gate (>= 88%)
        run: |
          OUTPUT=$(go test -race -cover ./...)
          echo "$OUTPUT"
          echo "$OUTPUT" | awk -F'coverage: |% of statements' '
            /coverage:/ {
              pkg = $1
              cov = $2 + 0
              if (cov < 88.0) {
                printf "FAIL: %s coverage %.1f%% is below 88.0%% threshold\n", pkg, cov
                failed = 1
              }
            }
            END { exit failed }
          '

      - name: Fuzz Smoke Test
        run: go test -fuzz=FuzzParseAndRoundTripSchema -fuzztime=3s ./pkg/doris

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Check gofmt
        run: |
          GOFMT_OUTPUT=$(gofmt -l .)
          if [ -n "$GOFMT_OUTPUT" ]; then
            echo "The following files are not formatted:"
            echo "$GOFMT_OUTPUT"
            exit 1
          fi
